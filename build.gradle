plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.2'
}

group = 'com.github.integrityupdate'
version = 'v1.0'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
}

dependencies {
    //SPIGOT - REPO: SpigotMC & Central
    //compileOnly "org.spigotmc:spigot-api:1.13-R0.1-SNAPSHOT"
    compileOnly files("libs/server.jar")

    //ADVENTURE - REPO: Central
    implementation "net.kyori:adventure-api:4.24.0"
    implementation "net.kyori:adventure-text-minimessage:4.24.0"
    implementation "net.kyori:adventure-platform-bukkit:4.4.1"

    //GSON - REPO: Central
    implementation 'com.google.code.gson:gson:2.13.1'

    //LOMBOK (FOR GETTERS AND SETTERS) - REPO: Central
    compileOnly "org.projectlombok:lombok:1.18.38"
    annotationProcessor "org.projectlombok:lombok:1.18.38"
    testCompileOnly "org.projectlombok:lombok:1.18.38"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.38"
}

def targetJavaVersion = 8
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

shadowJar {
    archiveFileName = project.name+".jar"

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    relocate("net.kyori", "com.github.integrityupdate.shade.kyori")
}

